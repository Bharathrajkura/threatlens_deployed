<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ThreatLens — Login</title>
<link rel="stylesheet" href="/frontend/css/auth.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>

<div class="auth-container">
  <div class="logo-block">
    <div class="logo-icon">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="30,4 56,18 56,42 30,56 4,42 4,18" fill="none" stroke="#00ffe7" stroke-width="2"/>
        <polygon points="30,12 48,22 48,38 30,48 12,38 12,22" fill="none" stroke="#00ffe7" stroke-width="1" opacity="0.4"/>
        <circle cx="30" cy="30" r="8" fill="#00ffe7" opacity="0.15"/>
        <circle cx="30" cy="30" r="4" fill="#00ffe7"/>
        <line x1="30" y1="4" x2="30" y2="22" stroke="#00ffe7" stroke-width="1" opacity="0.5"/>
        <line x1="30" y1="38" x2="30" y2="56" stroke="#00ffe7" stroke-width="1" opacity="0.5"/>
      </svg>
    </div>
    <h1 class="logo-title">THREAT<span>LENS</span></h1>
    <p class="logo-sub">AI-Based Cyber Threat Detection</p>
  </div>

  <div class="auth-card" id="loginCard">
    <div class="card-header">
      <span class="card-label">// SECURE LOGIN</span>
    </div>

    <div id="alertBox" class="alert hidden"></div>

    <div class="form-group">
      <label>EMAIL</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="analyst@domain.com" autocomplete="off"/>
        <span class="input-glow"></span>
      </div>
    </div>

    <div class="form-group">
      <label>PASSWORD</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••"/>
        <span class="input-glow"></span>
      </div>
    </div>

    <button class="btn-primary" id="loginBtn" onclick="doLogin()">
      <span class="btn-text">INITIALIZE SESSION</span>
      <span class="btn-loader hidden">AUTHENTICATING...</span>
    </button>

    <p class="switch-link">No account? <a href="/register">Register access →</a></p>
  </div>
</div>

<script>
async function doLogin() {
  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const emailRe  = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

  if (!email || !password) { showAlert('Please fill in all fields.', 'error'); return; }
  if (!emailRe.test(email)) { showAlert('Enter a valid email address.', 'error'); return; }

  btn.querySelector('.btn-text').classList.add('hidden');
  btn.querySelector('.btn-loader').classList.remove('hidden');
  btn.disabled = true;

  try {
    const res  = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) {
      showAlert('Access granted. Redirecting...', 'success');
      setTimeout(() => window.location.href = '/dashboard', 800);
    } else {
      showAlert(data.message || 'Invalid credentials.', 'error');
      resetBtn();
    }
  } catch(e) {
    showAlert('Connection error. Try again.', 'error');
    resetBtn();
  }
}

function resetBtn() {
  const btn = document.getElementById('loginBtn');
  btn.querySelector('.btn-text').classList.remove('hidden');
  btn.querySelector('.btn-loader').classList.add('hidden');
  btn.disabled = false;
}

function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.className = `alert ${type}`;
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
