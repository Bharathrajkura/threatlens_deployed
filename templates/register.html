<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ThreatLens — Register</title>
<link rel="stylesheet" href="/frontend/css/auth.css"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg-grid"></div>
<div class="scanline"></div>

<div class="auth-container">
  <div class="logo-block">
    <div class="logo-icon">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="30,4 56,18 56,42 30,56 4,42 4,18" fill="none" stroke="#00ffe7" stroke-width="2"/>
        <polygon points="30,12 48,22 48,38 30,48 12,38 12,22" fill="none" stroke="#00ffe7" stroke-width="1" opacity="0.4"/>
        <circle cx="30" cy="30" r="8" fill="#00ffe7" opacity="0.15"/>
        <circle cx="30" cy="30" r="4" fill="#00ffe7"/>
      </svg>
    </div>
    <h1 class="logo-title">THREAT<span>LENS</span></h1>
    <p class="logo-sub">Create Analyst Account</p>
  </div>

  <div class="auth-card">
    <div class="card-header">
      <span class="card-label">// NEW ACCESS REQUEST</span>
    </div>

    <div id="alertBox" class="alert hidden"></div>

    <div class="form-group">
      <label>USERNAME</label>
      <div class="input-wrap">
        <input type="text" id="username" placeholder="analyst_01" autocomplete="off"/>
        <span class="input-glow"></span>
      </div>
    </div>

    <div class="form-group">
      <label>EMAIL</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="analyst@domain.com"/>
        <span class="input-glow"></span>
      </div>
    </div>

    <div class="form-group">
      <label>PASSWORD</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Min 6 characters"/>
        <span class="input-glow"></span>
      </div>
    </div>

    <div class="form-group">
      <label>CONFIRM PASSWORD</label>
      <div class="input-wrap">
        <input type="password" id="confirm" placeholder="Repeat password"/>
        <span class="input-glow"></span>
      </div>
    </div>

    <button class="btn-primary" id="regBtn" onclick="doRegister()">
      <span class="btn-text">CREATE ACCOUNT</span>
      <span class="btn-loader hidden">PROCESSING...</span>
    </button>

    <p class="switch-link">Already registered? <a href="/login">Login →</a></p>
  </div>
</div>

<script>
async function doRegister() {
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const btn      = document.getElementById('regBtn');

  if (!username || !email || !password) { showAlert('All fields required.', 'error'); return; }
  if (password.length < 6)              { showAlert('Password must be at least 6 characters.', 'error'); return; }
  if (password !== confirm)             { showAlert('Passwords do not match.', 'error'); return; }

  btn.querySelector('.btn-text').classList.add('hidden');
  btn.querySelector('.btn-loader').classList.remove('hidden');
  btn.disabled = true;

  try {
    const res  = await fetch('/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if (data.success) {
      showAlert('Account created! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/dashboard', 900);
    } else {
      showAlert(data.message || 'Registration failed.', 'error');
      resetBtn();
    }
  } catch(e) {
    showAlert('Connection error.', 'error');
    resetBtn();
  }
}

function resetBtn() {
  const btn = document.getElementById('regBtn');
  btn.querySelector('.btn-text').classList.remove('hidden');
  btn.querySelector('.btn-loader').classList.add('hidden');
  btn.disabled = false;
}

function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.className = `alert ${type}`;
}
</script>
</body>
</html>
